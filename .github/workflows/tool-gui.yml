name: Build A7M3 GUI tool
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload tested GUI tool assets to existing v0.01 (does not change firmware)'
        type: boolean
        default: false
  push:
    paths: ['tool/**', 'tools/custom_look_recipes.py', 'tools/look_recipes.py', 'recipes/**', '.github/workflows/tool-gui.yml']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test tool
        run: python -m unittest discover -s tool -p "test_*.py" -v
      - name: Install packaging dependency
        run: python -m pip install "pyinstaller>=6.10,<7"
      - name: Build source and native packages
        run: |
          python tool/build.py --out tool-output
          python tool/build.py --native --out tool-output
      - name: Run unpacked native tool
        run: python tool/smoke_bundle.py tool-output
      - uses: actions/upload-artifact@v4
        with:
          name: A7M3-Tool-${{ matrix.os }}
          path: tool-output/*
          if-no-files-found: error
  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: tool-artifacts
      - name: Publish tested tool packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tool/publish.py tool-artifacts
